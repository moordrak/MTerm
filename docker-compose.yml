services:
  mterm:
    image: ghcr.io/moordrak/mterm:latest
    container_name: mterm
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MTERM_USER=admin
      - MTERM_PASSWORD=promijeni-me   # obavezno promijenite!
      # - MTERM_SESSION_HOURS=12
      # - MTERM_IDLE_MINUTES=30
      # - MTERM_SERVER_STORAGE=false   # isključi spremanje veza na server
    volumes:
      - mterm-data:/data   # spremljene veze, postavke i ključ za šifriranje

volumes:
  mterm-data:
